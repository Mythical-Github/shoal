[project]
name = "shoal"
version = "0.1.0"
description = "A tui frontend for several Call of Duty mod clients/projects"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pywinctl>=0.4.1",
    "requests>=2.32.4",
    "textual>=1.0.0,<2.1.3",
    "textual-spinbox",
    "tomlkit>=0.13.3",
]

[tool.uv.sources]
textual-spinbox = { git = "https://github.com/friscorose/textual-spinbox" }

[build-system]
requires = ["uv_build>=0.7.19,<0.8"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "commitizen>=4.8.3",
    "pre-commit>=4.2.0",
    "pyinstaller>=6.15.0",
    "pyright>=1.1.403",
    "ruff>=0.12.8",
]

[project.scripts]
shoal = "shoal.__main__:main"

[project.urls]
Documentation = "https://github.com/Mythical-Github/shoal/blob/main/README.md"
Issues = "https://github.com/Mythical-Github/shoal/issues"
Source = "https://github.com/Mythical-Github/shoal"

[tool.pyright]
extraPaths = [".venv/Lib/site-packages"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "semver2"
version_provider = "pep621"
update_changelog_on_bump = true
